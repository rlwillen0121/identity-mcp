# Copy into ~/.codex/config.toml (merge) or a project .codex/config.toml.
# Requires okta-mcp, entra-mcp, lumos-mcp, sailpoint-mcp, and c1-mcp on PATH
# (`go install ./cmd/okta-mcp ./cmd/entra-mcp ./cmd/lumos-mcp ./cmd/sailpoint-mcp ./cmd/c1-mcp`).
# Codex reads AGENTS.md at the repo root for lane rules.
# Codex does not enforce contributor vs operator MCP isolation in this file;
# keep live IdP tools out of coding sessions by convention (use a separate
# operator profile, or do not load this MCP block while editing Go).

[mcp_servers.okta]
command = "okta-mcp"
startup_timeout_sec = 15

[mcp_servers.okta.env]
OKTA_ORG_URL = "${OKTA_ORG_URL}"
OKTA_API_TOKEN = "${OKTA_API_TOKEN}"

[mcp_servers.entra]
command = "entra-mcp"
startup_timeout_sec = 15

[mcp_servers.entra.env]
AZURE_TENANT_ID = "${AZURE_TENANT_ID}"
AZURE_CLIENT_ID = "${AZURE_CLIENT_ID}"
AZURE_CLIENT_SECRET = "${AZURE_CLIENT_SECRET}"

[mcp_servers.lumos]
command = "lumos-mcp"
startup_timeout_sec = 15

[mcp_servers.lumos.env]
LUMOS_API_TOKEN = "${LUMOS_API_TOKEN}"
LUMOS_BASE_URL = "${LUMOS_BASE_URL}"

[mcp_servers.sailpoint]
command = "sailpoint-mcp"
startup_timeout_sec = 15

[mcp_servers.sailpoint.env]
SAILPOINT_TENANT = "${SAILPOINT_TENANT}"
SAILPOINT_CLIENT_ID = "${SAILPOINT_CLIENT_ID}"
SAILPOINT_CLIENT_SECRET = "${SAILPOINT_CLIENT_SECRET}"
SAILPOINT_BASE_URL = "${SAILPOINT_BASE_URL}"
SAILPOINT_TOKEN_URL = "${SAILPOINT_TOKEN_URL}"

[mcp_servers.c1]
command = "c1-mcp"
startup_timeout_sec = 15

[mcp_servers.c1.env]
C1_CLIENT_ID = "${C1_CLIENT_ID}"
C1_CLIENT_SECRET = "${C1_CLIENT_SECRET}"
C1_BASE_URL = "${C1_BASE_URL}"
C1_TOKEN_URL = "${C1_TOKEN_URL}"
