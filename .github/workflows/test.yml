name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Validate shipped JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path(".mcp.json"),
              Path("opencode.json"),
              *Path("examples").glob("*.json"),
          ]
          for path in paths:
              json.loads(path.read_text())
              print(f"valid JSON: {path}")

          assert json.loads(Path(".mcp.json").read_text())["mcpServers"] == {}
          assert json.loads(Path("examples/claude.mcp.json").read_text())["mcpServers"] == {}
          for path in (Path("opencode.json"), Path("examples/opencode.json")):
              mcp = json.loads(path.read_text()).get("mcp", {})
              assert mcp and all(not server.get("enabled", True) for server in mcp.values())
          operator = json.loads(Path("examples/opencode.operator.json").read_text())["mcp"]
          assert all(server.get("enabled") is True for server in operator.values())
          assert json.loads(Path("examples/claude.settings.json").read_text())["enableAllProjectMcpServers"] is False
          print("contributor/operator MCP profiles are separated")
          PY
      - name: Check known mutable action references
        run: |
          ! grep -R -nE 'uses: [^#[:space:]]+@(main|master|v[0-9]+|latest)([[:space:]]|$)' .github/workflows
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
      - run: go build -o /tmp/okta-mcp ./cmd/okta-mcp
      - run: go build -o /tmp/entra-mcp ./cmd/entra-mcp
